[package]
name = "zstar-app-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "zstar_app_host"
path = "src/lib.rs"

[[bin]]
name = "zstar"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
zstar-agent-core = { path = "../agent-core" }
zstar-provider = { path = "../provider-plane" }
zstar-compat-openclaw = { path = "../compat-openclaw" }
zstar-manifests = { path = "../manifests" }
zstar-tools = { path = "../zstar-tools" }
zstar-session-runtime = { path = "../session-runtime" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
comrak = "0.36"
syntect = "5.2"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3"

