[package]
name = "matrixclaw-app-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "matrixclaw_app_host"
path = "src/lib.rs"

[[bin]]
name = "matrixclaw"
path = "src/main.rs"

[dependencies]
matrixclaw-agent-core = { path = "../agent-core" }
matrixclaw-compat-openclaw = { path = "../compat-openclaw" }
matrixclaw-manifests = { path = "../manifests" }
matrixclaw-session-runtime = { path = "../session-runtime" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[package.metadata.matrixclaw.ui]
workspace = "../../ui"
build_output = "../../ui/build"
shell_entry = "index.html"
client_route_fallback = "index.html"
