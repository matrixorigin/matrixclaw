[package]
name = "matrixclaw-app-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "matrixclaw_app_host"
path = "src/lib.rs"

[[bin]]
name = "matrixclaw"
path = "src/main.rs"

[dependencies]
matrixclaw-agent-core = { path = "../agent-core" }
matrixclaw-manifests = { path = "../manifests" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
