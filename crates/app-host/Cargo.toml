[package]
name = "matrixclaw-app-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "matrixclaw_app_host"
path = "src/lib.rs"

[[bin]]
name = "matrixclaw"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
matrixclaw-agent-core = { path = "../agent-core" }
matrixclaw-provider = { path = "../provider-plane" }
matrixclaw-compat-openclaw = { path = "../compat-openclaw" }
matrixclaw-manifests = { path = "../manifests" }
matrixclaw-tools = { path = "../matrixclaw-tools" }
matrixclaw-session-runtime = { path = "../session-runtime" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }

