[package]
name = "sandwrench"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = { version = "0.60", optional = true }

[features]
default = ["docker"]
docker = []
e2b = []
daytona = []
wasm = []
ssh = ["dep:russh"]
