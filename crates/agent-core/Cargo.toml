[package]
name = "zstar-agent-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "zstar_agent_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
zstar-hooks = { path = "../zstar-hooks" }
zstar-manifests = { path = "../manifests" }
zstar-tools = { path = "../zstar-tools" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
