[package]
name = "matrixclaw-agent-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "matrixclaw_agent_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
matrixclaw-manifests = { path = "../manifests" }
matrixclaw-tools = { path = "../matrixclaw-tools" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
